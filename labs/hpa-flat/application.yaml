apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  namespace: hpa-flat
spec:
  selector:
    matchLabels:
      app: php-apache
  template:
    metadata:
      labels:
        app: php-apache
    spec:
      automountServiceAccountToken: false
      containers:
        - name: php-apache
          image: registry.k8s.io/hpa-example:latest
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: php-apache
  namespace: hpa-flat
spec:
  type: ClusterIP
  selector:
    app: php-apache
  ports:
    - name: http
      port: 80
      targetPort: http